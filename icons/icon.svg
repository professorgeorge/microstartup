  <line x1="442" y1="256" x2="472" y2="256" stroke="#7E6B60" stroke-width="8" stroke-linecap="round" />
  
  <!-- Hearth Flame / Needle Core -->
  <path d="M256 96 C270 170 330 220 330 286 C330 335 296 376 256 376 C216 376 182 335 182 286 C182 220 242 170 256 96 Z" fill="url(#warmGrad)" />
  
