<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF6F0" />
      <stop offset="100%" stop-color="#EEDFD0" />
    </radialGradient>
    
    <!-- Primary Needle Gradient (Terracotta to Coral) -->
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#C85A32" />
      <stop offset="100%" stop-color="#A53F1D" />
    </linearGradient>

    <!-- Secondary Needle Gradient (Espresso Warm Charcoal) -->
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3B32" />
      <stop offset="100%" stop-color="#251814" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4D5C3" />
      <stop offset="50%" stop-color="#CDBBA4" />
      <stop offset="100%" stop-color="#DFCFC0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#251814" flood-opacity="0.12" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Frame -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" stroke="#DFD1C0" stroke-width="6" />
  
  <!-- Outer Calibrated Compass Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#ringGrad)" stroke-width="4" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="#E4D5C3" stroke-width="2" stroke-dasharray="4 10" />
  
  <!-- Cardinal Tick Marks (N, S, E, W) -->
  <polygon points="256,48 262,68 250,68" fill="#C85A32" />
  <polygon points="256,464 260,444 252,444" fill="#7E6B60" />
  <polygon points="48,256 68,252 68,260" fill="#7E6B60" />
  <polygon points="464,256 444,252 444,260" fill="#7E6B60" />

  <!-- Diagonal Compass Accents -->
  <circle cx="376" cy="136" r="3" fill="#CDBBA4" />
  <circle cx="376" cy="376" r="3" fill="#CDBBA4" />
  <circle cx="136" cy="376" r="3" fill="#CDBBA4" />
  <circle cx="136" cy="136" r="3" fill="#CDBBA4" />

  <!-- Compass Star Needle with Shadow -->
  <g filter="url(#subtleShadow)">
    <!-- North Pointer (Terracotta Flame Blade) -->
    <polygon points="256,76 290,256 256,228" fill="url(#needleNorth)" />
    <polygon points="256,76 256,228 222,256" fill="#C85A32" opacity="0.9" />
    
    <!-- South Pointer (Espresso Grounded Blade) -->
    <polygon points="256,436 290,256 256,284" fill="url(#needleSouth)" />
    <polygon points="256,436 256,284 222,256" fill="#1B120E" />

    <!-- East/West Subtle Cross Needles -->
    <polygon points="436,256 256,242 276,256" fill="#D97706" opacity="0.85" />
    <polygon points="76,256 256,242 236,256" fill="#7E6B60" opacity="0.65" />
    <polygon points="436,256 276,256 256,270" fill="#B45309" opacity="0.85" />
    <polygon points="76,256 236,256 256,270" fill="#5A473D" opacity="0.65" />
    
    <!-- Center Pivot Core Hub -->
    <circle cx="256" cy="256" r="28" fill="#FAF6F0" stroke="#C85A32" stroke-width="6" />
    <circle cx="256" cy="256" r="14" fill="#251814" />
    <circle cx="251" cy="251" r="4" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
